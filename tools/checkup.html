<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파티마동물의료센터 · 건강검진 결과지</title>
<style>
  :root{ --teal:#127069; --ink:#16302c; --bg:#eef1ef; --line:#e0e7e4; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,'Segoe UI',sans-serif;
        background:var(--bg); color:var(--ink); }
  /* 상단바 */
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:12px 20px;
           background:#fff; border-bottom:1px solid #dbe2df; position:sticky; top:0; z-index:10; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .logo{ width:40px; height:40px; border-radius:9px; background:#fff;
         display:grid; place-items:center; overflow:hidden; }
  .logo img{ width:100%; height:100%; object-fit:contain; }
  .brand h1{ font-size:15px; margin:0; }
  .brand p{ font-size:11.5px; color:#8a938f; margin:2px 0 0; }
  .controls{ display:flex; gap:8px; align-items:center; }
  .toggle{ display:flex; background:#eef1ef; border-radius:9px; padding:3px; }
  .toggle button{ border:none; background:transparent; padding:7px 14px; border-radius:7px;
                  cursor:pointer; font-size:13px; font-weight:600; color:#6b746f; }
  .toggle button.on{ background:#fff; color:var(--teal); box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .print-btn{ background:var(--teal); color:#fff; border:none; padding:9px 16px; border-radius:8px;
              font-weight:600; font-size:13px; cursor:pointer; }
  .reset-btn{ background:#fff; color:#6b746f; border:1px solid #d3dbd7; padding:9px 14px;
              border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; }
  /* 레이아웃 */
  .body{ display:flex; gap:16px; padding:16px; align-items:flex-start; max-width:1400px; margin:0 auto; }
  .input-pane{ flex:0 0 420px; background:#fff; border-radius:12px; border:1px solid #dbe2df;
               overflow:hidden; position:sticky; top:78px; max-height:calc(100vh - 94px);
               display:flex; flex-direction:column; }
  .tabbar{ display:flex; flex-wrap:wrap; gap:2px; padding:8px; border-bottom:1px solid #eef1ef; }
  .tabbar button{ border:none; background:transparent; padding:6px 10px; border-radius:6px;
                  font-size:12px; cursor:pointer; color:#6b746f; font-weight:600; }
  .tabbar button.on{ background:var(--teal); color:#fff; }
  .input-scroll{ overflow-y:auto; padding:16px; }
  .tabpage{ display:none; }
  .tabpage.on{ display:block; }
  .sect{ margin-bottom:20px; }
  .sect-title{ font-size:13px; font-weight:700; color:var(--teal); margin-bottom:10px;
               padding-bottom:6px; border-bottom:2px solid #e3ecea; }
  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  .field > span{ font-size:11.5px; color:#6b746f; font-weight:600; }
  .field .row{ display:flex; align-items:center; gap:6px; }
  input,select,textarea{ border:1px solid #d3dbd7; border-radius:7px; padding:7px 9px; font-size:13px;
         width:100%; font-family:inherit; background:#fcfdfc; }
  textarea{ min-height:60px; resize:vertical; }
  .unit{ font-size:11px; color:#9aa39f; white-space:nowrap; }
  .lab-row{ display:flex; align-items:center; gap:6px; padding:3px 0; }
  .lab-row .name{ width:96px; font-weight:600; font-size:12.5px; }
  .lab-row .ref{ width:88px; font-size:11px; color:#8a938f; }
  .lab-row input{ width:70px; text-align:right; }
  .lab-row .u{ width:48px; font-size:10.5px; color:#9aa39f; }
  .lab-row .flag{ font-weight:700; font-size:13px; }
  .img-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0; }
  .img-slot{ aspect-ratio:4/3; border:1.5px dashed #cdd6d2; border-radius:8px; display:grid;
             place-items:center; cursor:pointer; overflow:hidden; background:#f7faf9;
             color:#aeb6b2; font-size:12px; position:relative; }
  .img-slot img{ width:100%; height:100%; object-fit:cover; }
  .img-slot .img-del{ position:absolute; top:4px; right:4px; width:22px; height:22px; border:none;
    border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:14px; line-height:1;
    cursor:pointer; display:grid; place-items:center; }
  .img-slot .img-del:hover{ background:rgba(192,57,43,.9); }
  .multi-img-btn{ background:#eef4f3; color:#127069; border:1px solid #cfe0dc; border-radius:7px;
    padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; }
  /* 보고서 */
  .preview-pane{ flex:1; display:flex; justify-content:center; }
  .sheet{ width:820px; background:#fff; padding:44px; box-shadow:0 2px 16px rgba(0,0,0,.08);
          border-radius:4px; font-size:12.5px; line-height:1.5; }
  .r-header{ display:flex; justify-content:space-between; align-items:flex-start;
             border-bottom:3px solid var(--teal); padding-bottom:14px; margin-bottom:18px; }
  .r-hospital{ font-size:15px; color:var(--teal); font-weight:700; letter-spacing:.5px; }
  .r-title{ font-size:24px; font-weight:800; margin-top:2px; }
  .r-species{ background:#e8f1ef; color:var(--teal); padding:6px 14px; border-radius:20px;
              font-weight:700; font-size:13px; }
  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; margin-bottom:22px;
              padding:14px; background:#f6f9f8; border-radius:8px; }
  .info-item{ display:flex; justify-content:space-between; border-bottom:1px solid #e6ece9; padding-bottom:4px; }
  .info-item .k{ color:#6b746f; font-size:12px; }
  .info-item .v{ font-weight:600; }
  .r-sect{ margin-bottom:20px; break-inside:avoid; }
  .rs-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:8px;
            border-bottom:1px solid var(--line); padding-bottom:4px; }
  .rs-en{ font-size:13px; font-weight:700; color:var(--teal); letter-spacing:.3px; }
  .rs-ko{ font-size:11.5px; color:#8a938f; }
  .sub-label{ font-size:12px; font-weight:600; margin-bottom:4px; }
  .op-label{ font-size:12px; font-weight:700; color:var(--teal); margin:12px 0 0; padding-left:8px;
    border-left:3px solid var(--teal); line-height:1.5; }
  .op-label-input{ font-size:12px; font-weight:700; color:var(--teal); margin:2px 0 4px; padding-left:7px;
    border-left:3px solid var(--teal); }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11px; color:#6b746f; font-weight:600; padding:5px 8px;
      background:#f2f6f5; border-bottom:1px solid var(--line); }
  td{ padding:5px 8px; border-bottom:1px solid #eef2f0; font-size:12px; }
  .r-img-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0; }
  .r-img{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .opinion{ background:#f7faf9; border:1px solid #e6ece9; border-radius:6px; padding:8px 10px;
            font-size:12px; margin-top:6px; white-space:pre-wrap; }
  .opinion.empty{ color:#b7bfbb; }
  .r-footer{ display:flex; justify-content:space-between; margin-top:24px; padding-top:12px;
             border-top:1px solid var(--line); font-size:10.5px; color:#9aa39f; }
  .hi{ color:#c0392b; } .lo{ color:#2563c9; } .no{ color:#7a8a86; }
  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff !important; }
    .body{ padding:0; display:block; }
    .preview-pane{ display:block; }
    .sheet{ box-shadow:none !important; width:100% !important; padding:0 !important; }
    .cover-page{ display:flex !important; page-break-after:always; }
  }
  @page{ size:A4; margin:14mm; }
  /* 표지 (인쇄 첫 장) */
  .cover-page{ display:none; flex-direction:column; align-items:center; text-align:center;
    min-height:262mm; padding:6mm 8mm 0; box-sizing:border-box; }
  .cv-band{ width:74%; margin-top:24mm; }
  .cv-rule{ height:3px; background:var(--teal); }
  .cv-title{ font-size:46px; font-weight:800; color:#3f4a47; letter-spacing:2px; margin:16px 0 10px; }
  .cv-sub{ font-size:13px; letter-spacing:6px; color:#8a938f; font-weight:600; margin-bottom:16px; }
  .cv-emblem{ margin-top:22mm; }
  .cv-emblem img{ width:78px; height:auto; }
  .cv-desc{ font-size:11.5px; color:#6b746f; line-height:1.9; margin-top:16px; max-width:90%;
    word-break:keep-all; }
  .cv-wish{ margin-top:auto; }
  .cv-wish-line{ font-size:16px; font-weight:700; color:#2b3532; }
  .cv-name{ display:inline-block; min-width:120px; border-bottom:1.5px solid #2b3532; padding:0 8px 2px;
    font-weight:800; color:var(--teal); }
  .cv-meta{ font-size:14px; font-weight:700; color:#2b3532; margin-top:14px; }
  .cv-meta span{ font-weight:600; color:#3f4a47; }
  .cv-footer{ margin-top:20mm; margin-bottom:6mm; }
  .cv-footer img{ width:150px; height:auto; }
</style>
</head>
<body>

<header class="topbar no-print">
  <div class="brand">
    <div class="logo" id="hdrLogo"></div>
    <div><h1>파티마동물의료센터</h1><p>건강검진 결과 기록지 · 작성 도구</p></div>
  </div>
  <div class="controls">
    <div class="toggle" id="speciesToggle">
      <button data-sp="강아지" class="on">🐶 강아지</button>
      <button data-sp="고양이">🐱 고양이</button>
    </div>
    <button class="reset-btn" onclick="doReset()">초기화</button>
    <button class="print-btn" onclick="window.print()">보고서 인쇄 / PDF</button>
  </div>
</header>

<div class="body">
  <div class="input-pane no-print">
    <div class="tabbar" id="tabbar"></div>
    <div class="input-scroll" id="inputScroll"></div>
  </div>
  <div class="preview-pane">
    <div class="cover-page" id="cover">
      <div class="cv-band">
        <div class="cv-rule"></div>
        <div class="cv-title">건강검진 결과지</div>
        <div class="cv-sub">FATIMA ANIMAL MEDICAL CENTER</div>
        <div class="cv-rule"></div>
      </div>
      <div class="cv-emblem"><img id="cvEmblem" alt=""></div>
      <div class="cv-desc">파티마동물의료센터는 아이의 평생 건강관리에 도움이 될 수 있도록<br>전문 의학용어와 상세한 수치가 포함된 결과지를 제공하고 있습니다.<br>검진 담당 주치의가 세심하게 작성한 파티마의 건강검진 결과지는<br>우리 아이의 건강 모니터링 및 다음 검진을 위한 귀중한 자료입니다.</div>
      <div class="cv-wish">
        <div class="cv-wish-line"><span class="cv-name" id="cvName"></span>의 건강하고 행복한 삶을 진심으로 기원합니다.</div>
        <div class="cv-meta">검사일자 : <span id="cvDate"></span></div>
        <div class="cv-meta">담당 주치의 : <span id="cvVet"></span></div>
      </div>
      <div class="cv-footer"><img id="cvLogo" alt="파티마동물의료센터"></div>
    </div>
    <div class="sheet" id="report"></div>
  </div>
</div>

// ── 유틸: 정상범위 판정 ─────────────────────────────────────
function parseRange(ref){
  if(!ref||ref==="-")return null;
  let m=ref.match(/([\d.]+)\s*~\s*([\d.]+)/); if(m)return{min:+m[1],max:+m[2]};
  m=ref.match(/>\s*([\d.]+)/); if(m)return{min:+m[1],max:Infinity};
  m=ref.match(/<\s*([\d.]+)/); if(m)return{min:-Infinity,max:+m[1]};
  return null;
}
function flag(val,ref){
  const v=parseFloat(val), r=parseRange(ref);
  if(isNaN(v)||!r)return null;
  if(v>r.max)return"high"; if(v<r.min)return"low"; return"normal";
}
const SYM={high:"▲",low:"▼",normal:"〓"}, CLS={high:"hi",low:"lo",normal:"no"};
// 소변검사 판정: pH/U.S.G/UPC는 수치 기준, 나머지(PRO/GLU/BLD/BIL)는 음성=정상
const URINE_NUM={ "pH":"5.5 ~ 8", "U.S.G":"> 1.030", "UPC":"< 0.3" };
const URINE_NEG=["","-","−","(-)","(−)","음성","negative","neg","none","정상","0","normal"];
function urineFlag(name,val){
  if(val==null||String(val).trim()==="")return null;
  if(URINE_NUM[name])return flag(val,URINE_NUM[name]);
  return URINE_NEG.includes(String(val).trim().toLowerCase())?"normal":"high";
}
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// ── 붙여넣기 오버라이드(장비 판정/범위 우선) ────────────────
const ovKey=(sk,name)=>sk+"|"+name;
function rowRef(sk,name,defRef){ const o=st.ov[ovKey(sk,name)]; return (o&&o.ref)?o.ref:defRef; }
function rowFlag(sk,name,val,defRef){ const o=st.ov[ovKey(sk,name)]; if(o&&o.flag!==undefined)return o.flag; return flag(val,defRef); }
// 검사명 정규화: 대문자화 + 위첨자/공백/괄호 제거
const norm=s=>(s||"").toUpperCase().replace(/[⁺⁻＋－]/g,"").replace(/[()]/g,"").replace(/\s+/g,"");

// SheetJS(엑셀 해석기) 지연 로드 — 파일 불러오기 눌렀을 때만, 인터넷에서
let _xlsxPromise=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(_xlsxPromise)return _xlsxPromise;
  const urls=[
    "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
  ];
  _xlsxPromise=new Promise((resolve,reject)=>{
    let i=0;
    const tryNext=()=>{
      if(i>=urls.length){ reject(new Error("load failed")); return; }
      const sc=document.createElement("script"); sc.src=urls[i++];
      sc.onload=()=>window.XLSX?resolve(window.XLSX):tryNext();
      sc.onerror=tryNext;
      document.head.appendChild(sc);
    };
    tryNext();
  });
  return _xlsxPromise;
}

// 현재 종 기준 검사명 → 저장위치 매핑 (CBC/혈액화학/전해질/기타)
function buildLookup(){
  const map={};
  const add=(rows,store,sk)=>rows.forEach(([name,ref])=>{ const n=norm(name); if(!(n in map))map[n]={store,sk,name,ref}; });
  add(CBC[st.species],st.cbc,"cbc");
  add(CHEM[st.species],st.chem,"chem");
  add(ELYTES[st.species],st.ely,"ely");
  add(ETC[st.species],st.etc,"etc");
  return map;
}
// 붙여넣은 장비 결과 텍스트를 파싱해 값/판정/범위를 채움
function importPaste(text){
  printed=false;
  const lookup=buildLookup();
  const done=new Set(); const matched=[];
  text.split(/\r?\n/).forEach(line=>{
    const cells=line.split("\t").map(c=>c.trim()).filter(c=>c!=="");
    if(!cells.length)return;
    let hit=null,nkey=null;
    for(const c of cells){ const n=norm(c); if(lookup[n]&&!done.has(n)){ hit=lookup[n]; nkey=n; break; } }
    if(!hit)return;
    // 값 셀: 판정기호가 있는 셀 우선, 없으면 '~' 없는 순수 숫자 셀
    let vcell=cells.find(c=>/[▲▼〓]/.test(c));
    if(!vcell)vcell=cells.find(c=>!c.includes("~")&&norm(c)!==nkey&&/^-?\d+\.?\d*$/.test(c.replace(/[()▲▼〓<>\s]/g,"")));
    if(!vcell)return;
    const num=(vcell.match(/-?\d+\.?\d*/)||[])[0];
    if(num===undefined)return;
    let fl; if(/▲/.test(vcell))fl="high"; else if(/▼/.test(vcell))fl="low"; else if(/〓/.test(vcell))fl="normal"; else fl=undefined;
    const refc=cells.find(c=>c.includes("~")&&/\d/.test(c));
    const cleanRef=refc?((refc.match(/[\d.]+\s*~\s*[\d.]+/)||[refc])[0]):undefined;
    hit.store[hit.name]=num;
    st.ov[ovKey(hit.sk,hit.name)]={val:num,flag:fl,ref:cleanRef};
    done.add(nkey); matched.push(hit.name);
  });
  // 못 채운 항목(장비에 없어 수기 입력 필요)
  const missing=[];
  [[CBC[st.species]],[CHEM[st.species]],[ELYTES[st.species]],[ETC[st.species]]].forEach(([rows])=>
    rows.forEach(([name])=>{ if(!done.has(norm(name)))missing.push(name); }));
  return {matched,missing};
}

// 사진을 화면·인쇄에 충분한 크기로 자동 축소(용량↓, 속도↑)
function scaleImageFile(file, maxW=1600, quality=0.85){
  return new Promise((resolve)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        try{
          const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          const ctx=cv.getContext("2d");
          ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          resolve(cv.toDataURL("image/jpeg",quality));
        }catch(e){ resolve(r.result); }
      };
      img.onerror=()=>resolve(r.result);
      img.src=r.result;
    };
    r.onerror=()=>resolve(null);
    r.readAsDataURL(file);
  });
}
function imgSlot(key,label){

function imgGrid(keys){
  const wrap=document.createElement("div");

  return wrap;
}

// ── 폴더에서 사진 일괄 추가 (파일명 키워드로 항목 매칭) ───────
// [키워드, 슬롯 접두어, 최대 칸수]
const IMG_GROUPS=[["신체","신체",6],["방사선","방사선",4],["복부","복부",4],
  ["구강","구강",4],["심장","심장",4],["소변","소변",2]];
function readAsDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}
async function bulkAddImages(fileList){
  printed=false;
  const files=[...fileList].filter(f=>(f.type&&f.type.startsWith("image/"))||/\.(png|jpe?g|gif|webp|bmp)$/i.test(f.name));
  const buckets={}; IMG_GROUPS.forEach(([,pre])=>buckets[pre]=[]);
  const unmatched=[];
  files.forEach(f=>{
    const g=IMG_GROUPS.find(([kw])=>f.name.includes(kw));
    if(g)buckets[g[1]].push(f); else unmatched.push(f.name);
  });
  const numOf=n=>{ const m=n.match(/(\d+)/); return m?parseInt(m[1],10):999999; };
  const added={}, overflow=[];
  for(const [,pre,max] of IMG_GROUPS){
    const list=buckets[pre].sort((a,b)=>numOf(a.name)-numOf(b.name)||a.name.localeCompare(b.name));
    const keys=[]; for(let i=1;i<=max;i++)keys.push(pre+i);
    const empty=keys.filter(k=>!st.img[k]);
    let ai=0;
    for(const f of list){
      if(ai<empty.length){ const url=await scaleImageFile(f); if(url)st.img[empty[ai]]=url; ai++; }
      else overflow.push(f.name);
    }
    if(ai>0)added[pre]=ai;
  }
  return {added, unmatched, overflow, total:files.length};
}

      field("이름",st.info.이름,v=>st.info.이름=v),

      field("프로그램",st.info.프로그램,v=>st.info.프로그램=v),

      field("주치의",st.info.주치의,v=>st.info.주치의=v)
    ));
  } else if(t==="🩸 검사결과 붙여넣기"){
    const s=sect("장비 검사결과 붙여넣기");
    const body=s.querySelector("div:last-child");
    const guide=document.createElement("div");
    guide.style.cssText="font-size:12px;color:#6b746f;line-height:1.6;margin-bottom:10px";

      장비 결과 엑셀을 열고 <b>결과 표 전체를 드래그해 복사(Ctrl+C)</b>한 뒤 아래 칸에 <b>붙여넣기(Ctrl+V)</b> → “결과 채우기”.<br>
      <span style="color:#9aa39f">범위를 정확히 고를 필요 없이 통째로 붙여넣어도 됩니다. 검사명이 있는 줄만 자동으로 골라 채웁니다.</span>`;
    body.appendChild(guide);

    // 결과 요약 출력(붙여넣기·파일 공용)
    const out=document.createElement("div");
    out.className="paste-out";
    out.style.cssText="margin-top:10px;font-size:12px;line-height:1.6";
    const showResult=(r,none)=>{
      out.innerHTML = r.matched.length
        ? `<div style="color:#127069;font-weight:600">✔ ${r.matched.length}개 항목을 채웠습니다.</div>
           <div style="color:#7a8a86;margin-top:4px">${r.matched.join(", ")}</div>`
           +(r.missing.length?`<div style="margin-top:8px;color:#9aa39f">장비에 없어 직접 입력할 항목: ${r.missing.join(", ")}</div>`:"")
        : `<span style="color:#c0392b">${none||"일치하는 검사명을 찾지 못했습니다. 검사명이 포함된 표인지 확인해 주세요."}</span>`;
      renderReport();
    };

    // ① 엑셀 파일 불러오기 (인터넷 필요 — SheetJS 로드)
    const fileBtn=document.createElement("button");
    fileBtn.textContent="① 엑셀 파일 불러오기 (.xls / .xlsx)";
    fileBtn.style.cssText="background:#127069;color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;width:100%";
    const fileInput=document.createElement("input");
    fileInput.type="file"; fileInput.accept=".xls,.xlsx,.xlsm"; fileInput.hidden=true;
    fileBtn.onclick=()=>fileInput.click();
    fileInput.onchange=e=>{
      const f=e.target.files[0]; if(!f)return;
      out.innerHTML=`<span style="color:#6b746f">파일을 읽는 중… (엑셀 해석기 로드)</span>`;
      loadXLSX().then(XLSX=>{
        const rd=new FileReader();
        rd.onload=ev=>{
          try{
            const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
            const ws=wb.Sheets[wb.SheetNames[0]];
            const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
            const text=rows.map(r=>r.map(c=>c==null?"":c).join("\t")).join("\n");
            showResult(importPaste(text),"파일은 읽었지만 일치하는 검사명을 찾지 못했습니다. 종(강아지/고양이) 설정을 확인해 주세요.");
          }catch(err){ out.innerHTML=`<span style="color:#c0392b">파일을 해석하지 못했습니다. 아래 복사·붙여넣기로 시도해 주세요.</span>`; }
        };
        rd.readAsArrayBuffer(f);
      }).catch(()=>{ out.innerHTML=`<span style="color:#c0392b">엑셀 해석기를 불러오지 못했습니다(인터넷 연결 확인). 아래 복사·붙여넣기를 이용해 주세요.</span>`; });
      fileInput.value="";
    };
    body.appendChild(fileBtn); body.appendChild(fileInput);

    const divider=document.createElement("div");
    divider.style.cssText="text-align:center;color:#aeb6b2;font-size:11px;margin:12px 0";
    divider.textContent="— 또는 복사·붙여넣기 —";

    // ② 복사·붙여넣기
    const ta=document.createElement("textarea");
    ta.style.cssText="min-height:130px;font-family:monospace;font-size:11.5px";

    const btn=document.createElement("button");

    btn.onclick=()=>{
      if(!ta.value.trim()){ out.innerHTML=`<span style="color:#c0392b">붙여넣은 내용이 없습니다.</span>`; return; }

    scroll.appendChild(s);
  } else if(t==="📁 사진 폴더 추가"){
    const s=sect("사진 폴더에서 일괄 추가");
    const body=s.querySelector("div:last-child");

      파일 이름에 <b>신체 · 방사선 · 복부 · 구강 · 심장 · 소변</b> 이 들어가면 해당 항목으로 들어갑니다.<br>
      <span style="color:#9aa39f">예) "신체1.png", "신체검사 2.jpg" → 신체검사 · "방사선 우측.png" → 방사선</span>`;

    btn.style.cssText="background:#127069;color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;width:100%";
    btn.onclick=()=>inp.click();

    out.style.cssText="margin-top:12px;font-size:12px;line-height:1.7";
    inp.onchange=async e=>{
      const files=e.target.files;

      const r=await bulkAddImages(files);
      let html="";
      const list=Object.entries(r.added);
      html += list.length
        ? `<div style="color:#127069;font-weight:600">✔ 추가됨: ${list.map(([k,v])=>k+" "+v+"장").join(", ")}</div>`
        : `<div style="color:#c0392b">추가된 사진이 없습니다. 파일 이름에 항목명이 들어있는지 확인해 주세요.</div>`;
      if(r.overflow.length)
        html+=`<div style="margin-top:8px;color:#b5710f">칸이 부족해 넣지 못한 파일 (${r.overflow.length}): ${r.overflow.map(esc).join(", ")}</div>`;
      if(r.unmatched.length)
        html+=`<div style="margin-top:8px;color:#9aa39f">이름에 항목명이 없어 매칭되지 않은 파일 (${r.unmatched.length}): ${r.unmatched.map(esc).join(", ")}</div>`;
      out.innerHTML=html;
      renderReport();
      inp.value="";
    };
    body.appendChild(btn); body.appendChild(inp); body.appendChild(out);
    scroll.appendChild(s);
  } else if(t==="신체검사"){
    const s=sect("신체검사");
    const body=s.querySelector("div:last-child");
    physRowsForSpecies().forEach(([n,u])=>body.appendChild(field(n,st.phys[n],v=>st.phys[n]=v,u)));
    body.appendChild(imgGrid(["신체1","신체2","신체3","신체4","신체5","신체6"]));
    body.appendChild(opinionField(st.op.신체,v=>st.op.신체=v));
    scroll.appendChild(s);
  } else if(t==="구강·영상"){
    scroll.appendChild(sect("구강검사",
      field("치아 및 치주검사",st.op.치아,v=>st.op.치아=v,null,true),
      field("구강 평가",st.op.구강,v=>st.op.구강=v,null,true),
      imgGrid(["구강1","구강2","구강3","구강4"]),
      opinionField(st.op.구강소견,v=>st.op.구강소견=v)
    ));
    [["방사선 검사","방사선",["방사선1","방사선2","방사선3","방사선4"]],["복부 초음파","복부",["복부1","복부2","복부3","복부4"]],
     ["심장 초음파","심장",["심장1","심장2","심장3","심장4"]]].forEach(([title,key,imgs])=>{
      scroll.appendChild(sect(title, imgGrid(imgs),
        opinionField(st.op[key],v=>st.op[key]=v)));
    });
  } else if(t==="소변"){
    const s=sect("소변검사"); const body=s.querySelector("div:last-child");
    const uguide=document.createElement("div");
    uguide.style.cssText="font-size:11px;color:#8a938f;line-height:1.6;margin-bottom:8px";
    uguide.innerHTML="PRO·GLU·BLD·BIL 은 <b>−, +, ++, +++</b> 로 입력하세요. (−=음성, +가 많을수록 강양성)<br>pH·U.S.G·UPC 는 수치로 입력하면 정상범위 기준으로 색상이 표시됩니다.";
    body.appendChild(uguide);
    URINE.forEach(([n,ref])=>{
      const row=document.createElement("div"); row.className="lab-row";
      row.innerHTML=`<span class="name" style="width:60px">${n}</span><span class="ref" style="width:66px">${ref}</span>`;
      const inp=document.createElement("input"); inp.style.width="80px"; inp.style.textAlign="left"; inp.value=st.urine[n]||"";
      if(!URINE_NUM[n]) inp.placeholder="− / + / ++ / +++";
      inp.oninput=e=>{ st.urine[n]=e.target.value; renderReport(); }; row.appendChild(inp);
      body.appendChild(row);
    });
    body.appendChild(imgGrid(["소변1","소변2"]));
    body.appendChild(opinionField(st.op.소변소견,v=>st.op.소변소견=v));
    scroll.appendChild(s);

    scroll.appendChild(sect("CBC — "+st.species+" 기준", labInputs(CBC[st.species],st.cbc,"cbc")));
  } else if(t==="혈액화학"){
    scroll.appendChild(sect("혈액화학 — "+st.species+" 기준", labInputs(CHEM[st.species],st.chem,"chem")));
  } else if(t==="전해질·기타"){
    scroll.appendChild(sect("전해질 — "+st.species+" 기준", labInputs(ELYTES[st.species],st.ely,"ely")));
    scroll.appendChild(sect("기타검사 — "+st.species+" 기준", labInputs(ETC[st.species],st.etc,"etc")));
    scroll.appendChild(sect("Snap 4Dx", field("결과",st.snap,v=>st.snap=v,null,false,"All negative")));
    scroll.appendChild(sect("혈액검사 주치의 소견",
      opinionField(st.op.혈액소견,v=>st.op.혈액소견=v,"주치의 소견 (CBC · 혈액화학 · 전해질 · 기타 통합)")));
  } else if(t==="종합"){
    scroll.appendChild(sect("종합소견",
      field("종합소견",st.op.종합,v=>st.op.종합=v,null,true,"검사 전반에 대한 종합 소견을 작성하세요")));
  }

// ── 보고서 렌더 ─────────────────────────────────────────────
function labTable(rows,store,sk){
  let h=`<table><thead><tr><th>검사항목</th><th>정상범위</th><th style="text-align:right">검사결과</th><th>설명</th></tr></thead><tbody>`;
  rows.forEach(([name,ref,unit])=>{
    const dref=rowRef(sk,name,ref);
    const f=rowFlag(sk,name,store[name],ref);
    const color=f?CLS[f]:"";
    h+=`<tr><td>${name}</td><td class="no">${dref}${unit?` (${unit})`:""}</td>
        <td style="text-align:right;font-weight:600" class="${color}">${esc(store[name])||"—"} ${f?SYM[f]:""}</td>
        <td style="font-size:10px;color:#8a938f">${DESC[name]||""}</td></tr>`;
  });
  return h+"</tbody></table>";
}
function imgRow(keys){
  const shown=keys.filter(k=>st.img[k]);
  if(!shown.length)return"";
  return `<div class="r-img-row">${shown.map(k=>`<img class="r-img" src="${st.img[k]}">`).join("")}</div>`;
}
function opinion(text,big){
  return `<div class="opinion${text?"":" empty"}"${big?' style="min-height:60px"':""}>${text?esc(text):"소견 미작성"}</div>`;
}
// 보고서: '주치의 소견' 라벨 + 소견 박스
function opinionBlock(text,label){
  return `<div class="op-label">${label||"주치의 소견"}</div>${opinion(text)}`;
}
function rsect(en,ko,inner){
  return `<div class="r-sect"><div class="rs-head"><span class="rs-en">${en}</span><span class="rs-ko">${ko}</span></div>${inner}</div>`;
}
function renderReport(){
  const i=st.info;
  let h=`<div class="r-header"><div><div class="r-hospital">파티마동물의료센터</div>
    <div class="r-title">건강검진 결과 기록지</div></div>
    <div class="r-species">${st.species==="강아지"?"🐶 강아지":"🐱 고양이"}</div></div>`;

  h+=`<div class="info-grid">`+[["이름",i.이름],["보호자 성함",i.보호자],["나이",i.나이],["성별",i.성별],
    ["프로그램",i.프로그램],["검사일자",i.검사일자],["주치의",i.주치의]]
    .map(([k,v])=>`<div class="info-item"><span class="k">${k}</span><span class="v">${esc(v)||"—"}</span></div>`).join("")+`</div>`;

  // 신체검사
  let physRows=physRowsForSpecies().map(([n,u])=>`<tr><td style="width:40%">${n}</td><td>${st.phys[n]?esc(st.phys[n])+" "+u:"—"}</td></tr>`).join("");
  h+=rsect("Physical examination","신체검사",
    `<table><tbody>${physRows}</tbody></table>${imgRow(["신체1","신체2","신체3","신체4","신체5","신체6"])}${opinionBlock(st.op.신체)}`);

  // 구강
  h+=rsect("Oral examination","구강검사",
    `<table><tbody><tr><td style="width:40%">치아 및 치주검사</td><td>${esc(st.op.치아)||"—"}</td></tr>
     <tr><td>구강 평가</td><td>${esc(st.op.구강)||"—"}</td></tr></tbody></table>${imgRow(["구강1","구강2","구강3","구강4"])}${opinionBlock(st.op.구강소견)}`);

  // 영상 (내용 있을 때만)
  const imaging=[["Radiography · 방사선","방사선",["방사선1","방사선2","방사선3","방사선4"]],
    ["Abdominal US · 복부 초음파","복부",["복부1","복부2","복부3","복부4"]],
    ["Echocardiography · 심장 초음파","심장",["심장1","심장2","심장3","심장4"]]]
    .filter(([l,k,imgs])=>st.op[k]||imgs.some(x=>st.img[x]));
  if(imaging.length){
    h+=rsect("Imaging","영상검사", imaging.map(([label,key,imgs])=>
      `<div style="margin-bottom:10px"><div class="sub-label">${label}</div>${imgRow(imgs)}${opinionBlock(st.op[key])}</div>`).join(""));
  }

  // 소변
  let urineRows=URINE.map(([n,ref,desc])=>{
    if(n==="BIL" && st.species==="강아지") desc+=" 정상 강아지에서도 미약하게 확인할 수 있습니다.";
    const f=urineFlag(n,st.urine[n]);
    const cls=f?CLS[f]:"";
    const sym=(f && URINE_NUM[n])?" "+SYM[f]:"";
    return `<tr><td>${n}</td><td class="no">${ref}</td>
     <td style="font-weight:600" class="${cls}">${esc(st.urine[n])||"—"}${sym}</td>
     <td style="font-size:10px;color:#8a938f">${desc}</td></tr>`;
  }).join("");
  h+=rsect("Urinalysis","소변검사",
    `<table><thead><tr><th>항목</th><th>정상범위</th><th>결과</th><th>설명</th></tr></thead><tbody>${urineRows}</tbody></table>`
    +`<div style="font-size:10px;color:#8a938f;margin-top:4px">표기 안내 : (−) 음성 · (+) 약양성 · (++) 중등도 양성 · (+++) 강양성 — + 기호가 많을수록 강하게 검출됩니다.</div>`
    +`${imgRow(["소변1","소변2"])}${opinionBlock(st.op.소변소견)}`);

  // CBC
  h+=rsect("Complete Blood Count","혈구검사 (CBC)", labTable(CBC[st.species],st.cbc,"cbc"));

  // 혈액화학
  h+=rsect("Chemistry","혈액화학", labTable(CHEM[st.species],st.chem,"chem"));

  // 전해질·기타
  let chem=labTable(ELYTES[st.species],st.ely,"ely")+`<div style="height:8px"></div>`+labTable(ETC[st.species],st.etc,"etc");
  if(st.snap)chem+=`<div style="margin-top:8px;font-size:12px"><b>Snap 4Dx:</b> ${esc(st.snap)}</div>`;
  chem+=opinionBlock(st.op.혈액소견,"주치의 소견 (혈액검사 종합)");
  h+=rsect("Electrolytes & Chemistry","전해질 · 기타검사",chem);

  // 종합
  h+=rsect("Overall Assessment","종합소견",opinion(st.op.종합,true));

  h+=`<div class="r-footer"><span>▲ 정상범위 초과   ▼ 정상범위 미만   〓 정상</span><span>파티마동물의료센터</span></div>`;
  document.getElementById("report").innerHTML=h;

  // 표지 자동 연동 (이름 / 검사일자 / 주치의)
  const setTxt=(id,v)=>{ const el=document.getElementById(id); if(el)el.textContent=v||""; };
  setTxt("cvName", st.info.이름);
  setTxt("cvDate", st.info.검사일자);
  setTxt("cvVet", st.info.주치의);
}

    if(["신체검사","CBC","혈액화학","전해질·기타"].includes(currentTab))showTab(currentTab);
    renderReport();

});

// ── 초기화 & 인쇄 여부 추적 ─────────────────────────────────
let printed=false;
window.addEventListener("beforeprint",()=>{ printed=true; });
// 인쇄 후 다시 입력하면 '저장 안 됨' 상태로 되돌림
document.getElementById("inputScroll").addEventListener("input",()=>{ printed=false; },true);
function doReset(){
  const msg = printed
    ? "입력한 내용을 모두 지우고 새로 시작할까요?"
    : "⚠️ 아직 보고서를 인쇄(PDF 저장)하지 않았습니다.\n지금 초기화하면 입력한 내용은 되살릴 수 없습니다.\n그래도 초기화할까요?";
  if(confirm(msg)) location.reload();
}

// ── 초기 렌더 ───────────────────────────────────────────────
document.getElementById("hdrLogo").innerHTML=`<img src="${LOGO_EMBLEM}" alt="파티마">`;
document.getElementById("cvEmblem").src=LOGO_EMBLEM;
document.getElementById("cvLogo").src=LOGO_FULL;
showTab("기본"); renderReport();
</script>
