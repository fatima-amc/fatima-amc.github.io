name: Sync internal tools to Firestore

on:
  push:
    paths:
      - "tools/**.html"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 도구 HTML을 Firestore로 업로드
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/upload_tool_html.py
